<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>대전충남 공동주택협회 회원 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#1b2430;--sub:#5d6875;--line:#e3e7ec;--bg:#f6f8fa;--card:#fff;
        --full:#1f3a5f;--assoc:#2a9d8f;--accent:#c8191e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .upd{margin-left:auto;font-size:12px;color:var(--sub)}
  .dl{display:none;gap:6px;align-items:center}
  .dl.on{display:flex}
  .dl select,.dl button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:#fff}
  .dl button{background:var(--ink);color:#fff;border-color:var(--ink);cursor:pointer;font-weight:600}
  .dl button:disabled{opacity:.5;cursor:wait}
  .admin-tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accent);color:#fff}
  .stats{display:flex;gap:8px}
  .stat{padding:4px 10px;border-radius:999px;font-size:12.5px;background:var(--bg);border:1px solid var(--line)}
  .stat b{font-variant-numeric:tabular-nums}
  aside{display:flex;flex-direction:column;min-height:0;background:var(--card);border-right:1px solid var(--line)}
  .filters{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:6px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .count{font-size:12px;color:var(--sub);padding:8px 14px 4px}
  ul{list-style:none;margin:0;padding:0 8px 12px;overflow:auto;flex:1}
  li{padding:10px;border-radius:10px;cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
  li:hover,li.active{background:var(--bg)}
  .dot{width:10px;height:10px;border-radius:50%}
  .nm{font-weight:600;font-size:14px}
  .ap{font-size:12.5px;color:var(--sub);margin-top:2px}
  .rg{font-size:11.5px;color:var(--sub);white-space:nowrap}
  .nogeo{font-size:11px;color:var(--accent)}
  .tag{font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--sub);margin-left:4px;font-weight:500}
  .tag.warn{border-color:var(--accent);color:var(--accent)}
  #map{min-height:0}
  .legend{background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:12px;line-height:1.7}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .pop h3{margin:0 0 4px;font-size:14px}
  .pop .addr{font-size:12px;color:var(--sub);margin-bottom:6px}
  .pop .p{font-size:12.5px;padding:3px 0;border-top:1px solid var(--line)}
  .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;margin-left:4px}
  .gate{position:fixed;inset:0;background:rgba(246,248,250,.97);display:none;align-items:center;justify-content:center;z-index:2000}
  .gate.on{display:flex}
  .gate form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;width:min(320px,90vw);display:grid;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  .gate h2{margin:0;font-size:16px}
  .gate p{margin:0;font-size:13px;color:var(--sub)}
  .gate button{padding:10px;border:0;border-radius:8px;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .gate .err{color:var(--accent);font-size:12.5px;min-height:1em}
  li.msg{display:block}
  .relogin{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:12.5px;color:var(--sub);cursor:pointer}
  .msg{padding:24px;text-align:center;color:var(--sub);font-size:14px}
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 52vh 1fr}
    header{flex-wrap:wrap;padding:10px 14px}
    header .upd{margin-left:0;width:100%}
    #map{grid-row:2}
    aside{grid-row:3;border-right:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gateForm">
    <h2>회원 지도</h2>
    <p>협회 임원용 페이지입니다. 비밀번호를 입력해 주세요.<br>관리자 비밀번호로 들어오면 명부를 내려받을 수 있습니다.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="비밀번호">
    <div class="err" id="gateErr"></div>
    <button type="submit">열기</button>
  </form>
</div>
<div class="app">
  <header>
    <h1 id="org">회원 지도</h1>
    <div class="stats">
      <span class="stat">전체 <b id="sAll">-</b></span>
      <span class="stat">정회원 <b id="sFull">-</b></span>
      <span class="stat">준회원 <b id="sAssoc">-</b></span>
      <span class="stat">승인대기 <b id="sPend">-</b></span>
    </div>
    <span class="upd" id="upd"></span>
    <button type="button" id="relogin" class="relogin">다른 비밀번호로 열기</button>
    <div class="dl" id="dl">
      <span class="admin-tag">관리자</span>
      <select id="dlScope"><option value="all">전체 회원</option><option value="approved">승인 회원만</option></select>
      <button id="dlBtn" type="button">명부 다운로드</button>
    </div>
  </header>
  <aside>
    <div class="filters">
      <input id="q" type="search" placeholder="이름·단지명 검색">
      <select id="region"><option value="">전체 지역</option></select>
      <div class="seg" id="grade">
        <button data-v="" class="on">전체</button>
        <button data-v="정회원">정회원</button>
        <button data-v="준회원">준회원</button>
      </div>
    </div>
    <div class="count" id="count"></div>
    <ul id="list"><li class="msg">불러오는 중…</li></ul>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLOR = { '정회원': getVar('--full'), '준회원': getVar('--assoc'), '확인필요': '#9aa3ad' };
const st = { all: [], q: '', region: '', grade: '' };
let map, layer, markerByKey = {};

function getVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tags(m){
  return (m.status !== '승인' ? '<span class="tag">' + esc(m.status) + '</span>' : '') +
         (m.suspended ? '<span class="tag warn">권리정지</span>' : '');
}
function keyOf(m){ return m.lat != null ? m.lat.toFixed(5) + ',' + m.lng.toFixed(5) : null; }

function initMap(){
  map = L.map('map', { zoomControl: true }).setView([36.3504, 127.3845], 11);   // 대전 시청 기준
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
  const lg = L.control({ position: 'bottomright' });
  lg.onAdd = () => { const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = '<div><i style="background:'+COLOR['정회원']+'"></i>정회원(입대의 회장)</div>' +
                  '<div><i style="background:'+COLOR['준회원']+'"></i>준회원</div>' +
                  '<div><i style="background:#fff;border:2px solid #5d6875;width:7px;height:7px"></i>이사회 승인대기</div>'; return d; };
  lg.addTo(map);
}

function filtered(){
  const q = st.q.trim();
  return st.all.filter(m =>
    (!st.region || m.region === st.region) &&
    (!st.grade || m.grade === st.grade) &&
    (!q || m.name.includes(q) || m.apt.includes(q)));
}

function render(){
  const list = filtered();
  layer.clearLayers(); markerByKey = {};

  // 같은 단지(좌표)는 하나의 마커로 묶음
  const groups = {};
  list.forEach(m => { const k = keyOf(m); if (k) (groups[k] = groups[k] || []).push(m); });
  Object.entries(groups).forEach(([k, ms]) => {
    const full = ms.some(m => m.grade === '정회원');
    const c = full ? COLOR['정회원'] : COLOR['준회원'];
    const pending = ms.every(m => m.status !== '승인');
    const mk = L.circleMarker([ms[0].lat, ms[0].lng], {
      radius: 8 + Math.min(ms.length - 1, 4) * 2, weight: pending ? 3 : 2,
      color: pending ? c : '#fff', fillColor: pending ? '#fff' : c, fillOpacity: .95
    }).bindPopup(
      '<div class="pop"><h3>' + esc(ms[0].apt) + '</h3><div class="addr">' + esc(ms[0].addr) +
      (ms[0].hh ? ' · ' + Number(ms[0].hh).toLocaleString() + '세대' : '') + '</div>' +
      ms.map(m => '<div class="p"><b>' + esc(m.name) + '</b><span class="badge" style="background:' + COLOR[m.grade] + '">' +
                  m.grade + '</span>' + tags(m) + '<br>' + esc(m.role) +
                  '<br><span style="color:#5d6875;font-size:11.5px">' + esc(m.basis) + '</span></div>').join('') + '</div>'
    ).addTo(layer);
    markerByKey[k] = mk;
  });

  const ul = document.getElementById('list');
  document.getElementById('count').textContent = '표시 ' + list.length + '명' +
    (list.some(m => m.lat == null) ? ' · 좌표 없음 ' + list.filter(m => m.lat == null).length + '명' : '');
  ul.innerHTML = list.length ? list.map((m, i) =>
    '<li data-i="' + i + '"><span class="dot" style="background:' + COLOR[m.grade] + '"></span>' +
    '<div><div class="nm">' + esc(m.name) + tags(m) + '</div><div class="ap">' + esc(m.apt) +
    (m.lat == null ? ' <span class="nogeo">· 위치 미확인</span>' : '') + '</div></div>' +
    '<span class="rg">' + esc(m.region) + '</span></li>').join('')
    : '<li class="msg">조건에 맞는 회원이 없습니다.</li>';
  ul.querySelectorAll('li[data-i]').forEach(li => li.onclick = () => {
    const m = list[li.dataset.i], k = keyOf(m);
    ul.querySelectorAll('li').forEach(x => x.classList.remove('active')); li.classList.add('active');
    if (k && markerByKey[k]) { map.flyTo([m.lat, m.lng], 15, { duration: .6 }); markerByKey[k].openPopup(); }
  });

  const pts = Object.values(markerByKey).map(mk => mk.getLatLng());
  if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 14 });
  else if (pts.length === 1) map.setView(pts[0], 14);
}

let currentPin = '';
function toCsv(head, rows){
  const cell = v => { let s = v == null ? '' : String(v);
    if (/^[=+\-@]/.test(s) && !/^-?\d/.test(s)) s = "'" + s;        // 엑셀 수식 주입 방지
    return '"' + s.replace(/"/g, '""') + '"'; };
  return '\uFEFF' + [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');   // BOM: 엑셀 한글 깨짐 방지
}
function download(name, text){
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
// ▼ Apps Script 웹 앱 URL (배포 관리 > 웹 앱 URL). 재배포해도 주소가 같으면 바꿀 필요 없음
const API_URL = 'https://script.google.com/macros/s/AKfycbzCgJVTk5saU2lu5Mlsfe7rsGvvQEiQx8ewMr2lmt-fz0jhlIKqTRNA3wDZ54QGYYYhQw/exec';

async function api(body){
  let res;
  try {
    res = await fetch(API_URL, {
    method: 'POST', credentials: 'omit', redirect: 'follow',
    body: JSON.stringify(body)                       // text/plain → 사전검사 없음
    });
  } catch (e) {
    throw new Error('서버에 연결하지 못했습니다. Apps Script를 최신 코드로 "새 버전" 배포했는지 확인해 주세요.');
  }
  if (!res.ok) throw new Error('서버 응답 ' + res.status);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '알 수 없는 오류');
  return j.data;
}

document.getElementById('dlBtn').onclick = async () => {
  const b = document.getElementById('dlBtn'); b.disabled = true; b.textContent = '준비 중…';
  try {
    const r = await api({ action: 'roster', pin: currentPin, scope: document.getElementById('dlScope').value });
    download(r.filename, toCsv(r.head, r.rows));
  } catch (e) { alert('다운로드 실패: ' + e.message); }
  b.disabled = false; b.textContent = '명부 다운로드';
};

function load(data){
  document.getElementById('dl').classList.toggle('on', !!data.isAdmin);
  document.getElementById('org').textContent = data.org + ' 회원 지도';
  document.getElementById('upd').textContent = '갱신 ' + data.updated;
  st.all = data.members;
  document.getElementById('sAll').textContent = st.all.length;
  document.getElementById('sFull').textContent = st.all.filter(m => m.grade === '정회원').length;
  document.getElementById('sAssoc').textContent = st.all.filter(m => m.grade === '준회원').length;
  document.getElementById('sPend').textContent = st.all.filter(m => m.status === '승인대기').length;
  const regions = [...new Set(st.all.map(m => m.region))];
  document.getElementById('region').innerHTML = '<option value="">전체 지역</option>' +
    regions.map(r => '<option>' + esc(r) + '</option>').join('');
  render();
}

document.getElementById('q').oninput = e => { st.q = e.target.value; render(); };
document.getElementById('region').onchange = e => { st.region = e.target.value; render(); };
document.querySelectorAll('#grade button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#grade button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); st.grade = b.dataset.v; render();
});

initMap();
const PIN_KEY = 'member-map-pin';
function savedPin(){ try { return localStorage.getItem(PIN_KEY) || ''; } catch(e){ return ''; } }
function storePin(v){ try { v ? localStorage.setItem(PIN_KEY, v) : localStorage.removeItem(PIN_KEY); } catch(e){} }

function fetchMembers(pin){
  api({ action: 'members', pin: pin })
    .then(d => { storePin(pin); currentPin = pin; document.getElementById('gate').classList.remove('on'); load(d); })
    .catch(err => {
      if (String(err.message).indexOf('PIN') >= 0) {
        storePin('');
        document.getElementById('gate').classList.add('on');
        document.getElementById('gateErr').textContent = pin ? '비밀번호가 맞지 않습니다.' : '';
        document.getElementById('pin').focus();
      } else {
        document.getElementById('gate').classList.remove('on');
        document.getElementById('list').innerHTML = '<li class="msg">불러오기 실패: ' + esc(err.message) + '</li>';
      }
    });
}
document.getElementById('relogin').onclick = () => {
  storePin(''); currentPin = '';
  document.getElementById('pin').value = ''; document.getElementById('gateErr').textContent = '';
  document.getElementById('gate').classList.add('on'); document.getElementById('pin').focus();
};
document.getElementById('gateForm').onsubmit = e => {
  e.preventDefault();
  document.getElementById('gateErr').textContent = '확인 중…';
  fetchMembers(document.getElementById('pin').value.trim());
};
fetchMembers(savedPin());
</script>
</body>
</html>
